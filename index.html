<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO and PWA General Meta -->
    <meta name="theme-color" content="#4361ee">
    <meta name="description" content="Skore Point is a web-based application designed to help schools manage student marks and generate reports.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Skore Point - School Management System</title>
    <base href="./">
    <meta name="app-version" content="1.4.2">

    <!-- Favicon and PWA Icons -->
    <link rel="icon" href="assets/icons/skore-icon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/skore-icon-144.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/skore-icon-96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/skore-icon-96.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="shared/css/components.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .loading-container {
            text-align: center;
            color: white;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;

            margin-bottom: 10px;
        

        }
        
        p {
            opacity: 0.8;
        }
    </style>
    <script src="services/cloudinary.service.js?v=20260218" defer></script>
    <script type="module" src="shared/js/app.js?v=20260218"></script>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Skore Point</h1>
        <p>Loading application...</p>
    </div>
</body>
</html>
