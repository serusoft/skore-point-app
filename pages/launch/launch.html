<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skore Point</title>
    <link rel="stylesheet" href="../../shared/css/base.css">
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    <link rel="stylesheet" href="launch.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../shared/js/app.js" defer></script>
    <script src="launch.js" defer></script>
</head>
<body>
    <div class="launch-screen">
        <div class="launch-container">
            <div class="logo-wrapper">
                <div class="logo">Skore Point</div>
            </div>
            <div class="tagline">Professional School Report Card Generator by SERUSOFT</div>
            <div class="loader">
                <div class="loader-bar"></div>
            </div>
            <div class="launch-buttons">
                <button id="getStartedBtn" class="btn btn-primary">
                    <i class="fas fa-rocket"></i> Get Started
                </button>
                <button id="installAppBtn" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Install App
                </button>
            </div>
        </div>
    </div>
</body>
</html>
