<script>
if (window.top === window.self) {
    var head = document.head || document.getElementsByTagName('head')[0];
    ['../../shared/css/variables.css','../../shared/css/base.css','../../shared/css/components.css','./register.css'].forEach(function(h){
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = h; head.appendChild(l);
    });
    var fa = document.createElement('link'); fa.rel = 'stylesheet'; fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'; head.appendChild(fa);
}
</script>

<!-- Navbar will be injected here by ui.js -->
<div id="navbar-container"></div>

<div class="auth-page register-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <h1>Skore Point</h1>
            </div>
            <h2>Create Account</h2>
            <p>Join Skore Point today</p>
        </div>
        
        <div class="alert error" id="registerError" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="registerErrorText"></span>
        </div>
        
        <div class="alert success" id="registerSuccess" style="display: none;">
            <i class="fas fa-check-circle"></i>
            <span>Account created successfully!</span>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="regName">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" id="regName" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="regEmail">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="regEmail" placeholder="john@school.edu" required>
            </div>
            
            <div class="form-group">
                <label for="regSubject">
                    <i class="fas fa-book"></i> Primary Teaching Subject
                </label>
                <input type="text" id="regSubject" placeholder="Mathematics" required>
            </div>
            
            <div class="image-upload" id="profileUploadArea">
                <i class="fas fa-user-circle"></i>
                <p>Upload Profile Picture</p>
                <span>Click to upload (Required)</span>
                <div class="image-preview" id="profilePreview" style="display: none;">
                    <img id="profilePreviewImg" src="" alt="Profile Preview">
                </div>
                <input type="file" class="file-input" id="profileFile" accept="image/*" required>
                <input type="hidden" id="profileUrl">
            </div>
            
            <div class="form-group">
                <label for="regPassword">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="password-input">
                    <input type="password" id="regPassword" placeholder="Minimum 6 characters" required minlength="6">
                    <button type="button" class="password-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <div class="password-input">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            <p>
                Already have an account? 
                <a href="../auth/login.html" data-page="login">Sign In</a>
            </p>
        </div>
    </div>
</div>
    <script src="../../shared/js/app.js" defer></script>
    <script src="../../shared/js/ui.js" defer></script>
    <script src="../../services/cloudinary.service.js" defer></script>
    <script src="register.js" defer></script>
