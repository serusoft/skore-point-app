<script>
if (window.top === window.self) {
    var head = document.head || document.getElementsByTagName('head')[0];
    ['../../shared/css/variables.css','../../shared/css/base.css','../../shared/css/components.css','./login.css'].forEach(function(h){
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = h; head.appendChild(l);
    });
    var fa = document.createElement('link'); fa.rel = 'stylesheet'; fa.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'; head.appendChild(fa);
    
    // Inject Viewport Meta Tag for Mobile Responsiveness
    var meta = document.createElement('meta');
    meta.name = "viewport";
    meta.content = "width=device-width, initial-scale=1.0";
    head.appendChild(meta);

    // Inject Body Background to match old version
    var style = document.createElement('style');
    style.innerHTML = 'body { background: var(--dark, #0f172a); color: var(--light, #f8fafc); min-height: 100vh; margin: 0; } .alert { word-break: break-word; white-space: normal; }';
    head.appendChild(style);
}
</script>

<!-- Navbar will be injected here by ui.js -->
<div id="navbar-container"></div>

<div class="auth-page login-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <h1>Skore Point</h1>
            </div>
            <h2>Welcome Back</h2>
            <p>Log in to your account</p>
        </div>
        
        <div class="alert error" id="loginError" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="loginErrorText"></span>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" placeholder="teacher@school.edu" required>
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <div class="password-input">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Log in
            </button>
        </form>
        
        <div class="footer-links">
            <div>
                <p style="margin-bottom: 8px;">Don’t have an account yet?</p>
                <a href="../auth/register.html" class="btn btn-outline-primary btn-block">Sign up</a>
            </div>
            <div>
                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>
<script src="../../shared/js/app.js" defer></script>
<script src="../../shared/js/ui.js" defer></script>
<script src="./login.js" defer></script>
