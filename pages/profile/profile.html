<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Skore Point</title>
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/base.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="main-container">
        <div class="profile-container">
            <div class="page-header">
                <h1><i class="fas fa-user-circle"></i> My Profile</h1>
                <button class="btn btn-secondary" id="backBtn">
                    <i class="fas fa-arrow-left"></i> Back
                </button>
            </div>

            <div class="profile-card">
                <form id="profileForm">
                    <div class="profile-header-section">
                        <div class="profile-image-wrapper">
                            <img src="" alt="Profile" id="profileImage">
                            <div class="profile-image-overlay" id="uploadTrigger">
                                <i class="fas fa-camera"></i>
                            </div>
                            <input type="file" id="profileUpload" accept="image/*" style="display: none;">
                        </div>
                        <div class="profile-title">
                            <h2 id="displayName">Loading...</h2>
                            <span class="role-badge" id="displayRole">Teacher</span>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Full Name</label>
                            <input type="text" id="fullName" required>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email Address</label>
                            <input type="email" id="email" required>
                            <small class="text-muted">Changing email may require re-login.</small>
                        </div>

                        <div class="form-group">
                            <label><i class="fas fa-book"></i> Primary Subject</label>
                            <input type="text" id="subject" placeholder="e.g. Mathematics">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../services/cloudinary.service.js"></script>
    <script src="../../shared/js/app.js" defer></script>
    <script src="../../shared/js/ui.js" defer></script>
    <script src="./profile.js" defer></script>
</body>
</html>
