<!-- pages/profile/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skore Point - My Profile</title>
    <link rel="stylesheet" href="../../shared/css/variables.css">
    <link rel="stylesheet" href="../../shared/css/base.css">
    <link rel="stylesheet" href="../../shared/css/components.css">
    <link rel="stylesheet" href="./profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar will be injected here by ui.js -->
    <div class="profile-page">
        <div class="profile-header">
            <button class="back-btn" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h1>My Profile</h1>
            <div class="profile-menu">
                <button class="menu-btn" id="profileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="menu-dropdown" id="profileMenuDropdown">
                    <a href="#" id="profileSettingsLink"><i class="fas fa-cog"></i> Profile Settings</a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
        
        <div class="profile-container">
            <div class="profile-card">
                <div class="profile-picture-section">
                    <div class="profile-picture-container" id="profilePictureContainer">
                        <div class="profile-picture" id="currentProfilePicture">
                            <!-- Profile picture will be loaded here -->
                        </div>
                        <button class="edit-picture-btn" id="editProfilePictureBtn">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <h2 id="profileUserName"></h2>
                    <p class="user-email" id="profileUserEmail"></p>
                    <span class="user-role" id="profileUserRole"></span>
                </div>
                
                <div class="profile-form">
                    <form id="updateProfileForm">
                        <div class="form-group">
                            <label for="profileName">
                                <i class="fas fa-user"></i> Full Name
                            </label>
                            <input type="text" id="profileName" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileSubject">
                                <i class="fas fa-book"></i> Teaching Subject
                            </label>
                            <input type="text" id="profileSubject" placeholder="Enter your subject" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="profileEmail">
                                <i class="fas fa-envelope"></i> Email Address
                            </label>
                            <input type="email" id="profileEmail" placeholder="your@email.com" required disabled>
                        </div>
                        
                        <div class="alert error" id="profileError" style="display: none;">
                            <i class="fas fa-exclamation-circle"></i>
                            <span id="profileErrorText"></span>
                        </div>
                        
                        <div class="alert success" id="profileSuccess" style="display: none;">
                            <i class="fas fa-check-circle"></i>
                            <span>Profile updated successfully!</span>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block" id="updateProfileBtn">
                            <i class="fas fa-save"></i> Update Profile
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../../shared/js/app.js" defer></script>
    <script src="../../shared/js/ui.js" defer></script>
    <script src="../../services/cloudinary.service.js" defer></script>
    <script src="./profile.js" defer></script>
</body>
</html>
